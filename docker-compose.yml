# Projeto ISOLADO do ecossistema Mirai.
# Rede propria (robot-voice-net). Nao toca nas redes/containers do ecossistema.
#
# ADAPTADO (26/10/2026): a borda real e o NGINX do host, nao o Traefik.
# O compose original exigia a rede externa "traefik" (que nao existe nesta
# maquina) e publicava labels de roteamento. Agora:
#   - o container so escuta em 127.0.0.1:3020 (nao expoe nada na internet);
#   - o vhost do Nginx (robot.miraitohope.com) faz o proxy.
# Isso segue a mesma regra dos outros stacks: so o Nginx abre 80/443.

services:
  robot-voice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robot-voice
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3020:3000"
    networks:
      - robot-voice-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  robot-voice-net:
    driver: bridge
